name: 스페셜 솔져 웹앱 배포

# 언제 배포하나
#  1) 새 릴리스를 발행(Publish)했을 때
#  2) Actions 에서 Run workflow 를 눌렀을 때
#  3) 15분마다 자동 확인: 모든 릴리스 중 가장 마지막에 올린 webapp*.zip 이 바뀌었으면 자동 배포
#     (서버 파일만 올린 새 릴리스가 '최신'이어도 웹앱은 그 전 릴리스에서 찾아서 배포)
on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  check:
    name: 새 파일 확인
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
      asset: ${{ steps.c.outputs.asset }}
      name: ${{ steps.c.outputs.name }}
      tag: ${{ steps.c.outputs.tag }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 모든 릴리스(초안 제외)에서 webapp*.zip 중 가장 마지막에 올린 파일
          INFO=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft | not) | .tag_name as $t | .assets[] | select(.name | test("^webapp.*\\.zip$")) | {id, updated_at, name, t: $t}] | sort_by(.updated_at) | last | "\(.id)-\(.updated_at) \(.t) \(.name)"')
          ASSET="${INFO%% *}"; REST="${INFO#* }"; TAG="${REST%% *}"; NAME="${REST#* }"
          if [ "$NAME" = "null" ]; then ASSET=""; fi
          if [ -z "$ASSET" ] || [ "$ASSET" = "null" ]; then echo "webapp zip 없음"; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"; echo "name=$NAME" >> "$GITHUB_OUTPUT"; echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          OWNER="$GITHUB_REPOSITORY_OWNER"; REPO="${GITHUB_REPOSITORY#*/}"
          LIVE=$(curl -fsSL "https://$OWNER.github.io/$REPO/deployed.txt?t=$(date +%s)" 2>/dev/null || echo none)
          echo "릴리스 파일: $TAG / $NAME ($ASSET) / 지금 배포된 것: $LIVE"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$ASSET" != "$LIVE" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "go=0" >> "$GITHUB_OUTPUT"; fi

  webapp:
    name: 아이폰 웹앱 (GitHub Pages)
    needs: check
    if: needs.check.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - name: 가장 최근 webapp 파일 받기
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.check.outputs.name }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          mkdir -p dl site
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir dl
          unzip -q "dl/$NAME" -d site
          touch site/.nojekyll
          echo "${{ needs.check.outputs.asset }}" > site/deployed.txt
          if [ -n "${{ vars.SS_SERVER }}" ]; then echo "window.SS_SERVER='${{ vars.SS_SERVER }}';" > site/config.js; fi
          ls site | head
      - name: 이 실행에 남아 있는 예전 파일 묶음 지우기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("github-pages")) | .id'); do
            echo "지움: $id"; gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
          done
      - uses: actions/configure-pages@v5
      # 파일 묶음 이름에 '몇 번째 시도'를 붙임 → 실패한 작업을 [Re-run] 해도
      # 전 시도의 묶음과 이름이 겹치지 않아 "Multiple artifacts named github-pages" 오류가 안 남
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - id: dep
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
